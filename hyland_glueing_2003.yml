hyland_glueing_2003:
  type: article
  title: Glueing and orthogonality for models of linear logic
  author:
  - Hyland, Martin
  - Schalk, Andrea
  date: 2003-02
  page-range: 183-231
  url:
    value: https://linkinghub.elsevier.com/retrieve/pii/S0304397501002419
    date: 2024-03-04
  serial-number:
    doi: 10.1016/S0304-3975(01)00241-9
    issn: '03043975'
  abstract: 'We present the general theory of the method of glueing and associated technique of orthogonality for constructing categorical models of all the structure of linear logic: in particular we treat the exponentials in detail. We indicate simple applications of the methods and show that they cover familiar examples.'
  parent:
    type: periodical
    title: Theoretical Computer Science
    issue: 1–2
    volume: 294
