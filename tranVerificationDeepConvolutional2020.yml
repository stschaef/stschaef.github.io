tranVerificationDeepConvolutional2020:
  type: article
  title: Verification of {Deep Convolutional Neural Networks Using ImageStars}
  author:
  - Tran, Hoang-Dung
  - Bak, Stanley
  - Xiang, Weiming
  - Johnson, Taylor T.
  date: 2020-05-14
  url:
    value: http://arxiv.org/abs/2004.05511
    date: 2025-02-19
  serial-number:
    arxiv: '2004.05511'
    doi: 10.48550/arXiv.2004.05511
  language: en-US
  abstract: Convolutional Neural Networks (CNN) have redefined stateof-the-art in many real-world applications, such as facial recognition, image classification, human pose estimation, and semantic segmentation. Despite their success, CNNs are vulnerable to adversarial attacks, where slight changes to their inputs may lead to sharp changes in their output in even well-trained networks. Set-based analysis methods can detect or prove the absence of bounded adversarial attacks, which can then be used to evaluate the effectiveness of neural network training methodology. Unfortunately, existing verification approaches have limited scalability in terms of the size of networks that can be analyzed.
  parent:
    type: periodical
